bind ^C new-window -c "$HOME"
bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind z resize-pane -Z
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind c kill-pane
bind x swap-pane -D
bind S choose-session
bind-key -T copy-mode-vi v send-keys -X begin-selection

set -g prefix C-Space
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 100000      # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @resurrect-strategy-nvim 'session'

# Status: session and current window on the left, these on the right
set -g @rose_pine_user 'on'
set -g @rose_pine_host 'on'
set -g @rose_pine_date_time '%Y-%m-%d %H:%M'
set -g @rose_pine_directory 'on'

# Follow the terminal's light/dark theme: main when dark, dawn when light.
# tmux fires these hooks when the terminal reports a theme change (mode 2031);
# re-running the plugin re-applies every style with the new variant.
if -F '#{==:#{client_theme},light}' 'set -g @rose_pine_variant dawn' 'set -g @rose_pine_variant main'
set-hook -g client-dark-theme 'set -g @rose_pine_variant main ; run-shell ~/.config/tmux/plugins/tmux/rose-pine.tmux'
set-hook -g client-light-theme 'set -g @rose_pine_variant dawn ; run-shell ~/.config/tmux/plugins/tmux/rose-pine.tmux'

run '~/.config/tmux/plugins/tpm/tpm'
