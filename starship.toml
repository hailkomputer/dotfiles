palette = "rose_pine"
command_timeout = 5000

[character]
success_symbol = "[[󰄛](pine) ❯](gold)"
error_symbol = "[[󰄛](love) ❯](gold)"
vimcmd_symbol = "[󰄛 ❮](text)"

[cmd_duration]
style = "bold gold"

[directory]
truncation_length = 4
style = "bold iris"

[git_branch]
style = "bold rose"

[git_status]
style = "bold love"

[hostname]
style = "bold rose"

[username]
format = "[$user]($style) on "
style_user = "bold foam"

[kubernetes]
format = 'on [⛵ $context](pine) '
disabled = false

[[kubernetes.contexts]]
context_pattern = "prod"
style = "bold love"

# Rose Pine names mapped to the terminal's ANSI colors, so the terminal's
# light/dark theme decides (ghostty maps these to Rose Pine / Rose Pine Dawn)
[palettes.rose_pine]
love = "red"
gold = "yellow"
rose = "cyan"
pine = "green"
foam = "blue"
iris = "purple"
text = "white"
